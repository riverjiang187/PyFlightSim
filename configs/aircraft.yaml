# Aircraft Physical Properties
# 飞机物理属性

name: "Cessna 172 Skyhawk"
mixer_type: "standard" # standard, delta, v-tail

mass_props:
  mass: 1300.0
  Ixx: 1000.0
  Iyy: 4000.0
  Izz: 4500.0

aero_params:
  S: 16.2         # Wing Area / 翼面积
  b: 10.9         # Wingspan / 翼展
  c: 1.5          # Chord / 弦长

  # --- NEW: Propulsion / 动力系统 ---
  max_thrust: 3000.0  # Newtons (Approximate for Cessna 172)

  # Longitudinal / 纵向
  C_L_0: 0.25
  C_L_alpha: 4.5
  C_D_0: 0.025
  K: 0.05
  C_m_0: 0.02
  C_m_alpha: -0.5
  C_m_q: -10.0
  C_L_delta_e: 0.5
  C_m_delta_e: -1.5

  # Lateral / 横侧向
  C_Y_beta: -0.31
  C_Y_delta_r: 0.187
  C_Y_p: 0.0
  C_Y_r: 0.0
  C_l_beta: -0.089
  C_l_delta_r: 0.010
  C_l_r: 0.0
  C_l_delta_a: 0.1
  C_n_delta_r: 0.05
  C_n_beta: 0.1
  C_l_p: -0.4
  C_n_r: -0.2

# --- NEW: Sensors / 传感器配置 (P1-1) ---
sensors:
  adc:
    airspeed_noise_std: 0.5
    alpha_noise_std: 0.01
    beta_noise_std: 0.01
    altitude_noise_std: 1.0
    climb_rate_noise_std: 0.2
  imu:
    gyro_noise_std: 0.005      # rad/s
    gyro_bias_tau: 100.0       # s
    gyro_bias_noise_std: 0.0001
    accel_noise_std: 0.05      # m/s^2
    accel_bias_tau: 100.0
    accel_bias_noise_std: 0.001
  gps:
    update_rate: 10.0          # Hz
    delay: 0.15                # s
    horizontal_std: 1.5        # m
    vertical_std: 3.0          # m